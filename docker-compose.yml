version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bpm_user
      POSTGRES_PASSWORD: bpm_pass_change_in_prod
      POSTGRES_DB: bpm_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm_user -d bpm_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BPM Application ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpm-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bpm_user:bpm_pass_change_in_prod@postgres:5432/bpm_platform?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-please-min-32-chars}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
