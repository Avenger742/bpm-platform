services:
  - type: web
    name: bpm-platform
    region: oregon
    env: node
    plan: free
    buildCommand: |
      npm install --include=dev
      cd client && npm install --include=dev && cd ..
      npm run build
      npx prisma generate
    startCommand: npx prisma db push && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bpm-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: bpm-postgres
    region: oregon
    plan: free
    databaseName: bpm_platform
    user: bpm_user
